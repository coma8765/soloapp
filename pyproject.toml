[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work", "outputs", ".venv-codegen", "**/generated/**", "**/node_modules/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Operator scripts add the repository to sys.path before importing shared helpers.
ignore = ["E402"]
