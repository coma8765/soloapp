- title: HTTP requests / second
  type: timeseries
  description: Measured at nginx gateway; includes network/auth checks. These HTTP panels are per service/DC, not per
    application pod. Internal auth subrequests are not separately counted.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: sum by(dc,route)(rate(soloapp_http_requests_total{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval]))
    legendFormat: '{{dc}} {{route}} {{status}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: reqps
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 6
  gridPos:
    x: 12
    y: 24
    w: 12
    h: 8
- title: HTTP latency — p50 / p95 / p99
  type: timeseries
  description: Measured at nginx gateway; includes network/auth checks. These HTTP panels are per service/DC, not per
    application pod. Internal auth subrequests are not separately counted.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: histogram_quantile(0.5,sum by(le,dc,route)(rate(soloapp_http_request_duration_seconds_bucket{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval])))
    legendFormat: p50 {{dc}} {{route}}
    datasource:
      type: prometheus
      uid: prometheus
  - refId: B
    expr: histogram_quantile(0.95,sum by(le,dc,route)(rate(soloapp_http_request_duration_seconds_bucket{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval])))
    legendFormat: p95 {{dc}} {{route}}
    datasource:
      type: prometheus
      uid: prometheus
  - refId: C
    expr: histogram_quantile(0.99,sum by(le,dc,route)(rate(soloapp_http_request_duration_seconds_bucket{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval])))
    legendFormat: p99 {{dc}} {{route}}
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 7
  gridPos:
