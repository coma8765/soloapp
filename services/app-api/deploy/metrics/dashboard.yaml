      < bool 20) + 2 * (time() - timestamp(probe_success{dc=~"$dc",service="whoami",pod=~"$pod",check="readiness"}) >=
      bool 20)
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
