id: null
uid: soloapp-whoami
title: app-api
schemaVersion: 39
version: 3
refresh: 5s
timezone: browser
time:
  from: now-1h
  to: now
tags:
- soloapp
- lite
description: Per-pod HTTP health probes and service-specific telemetry. Missing data is not success. Business HTTP latency/RPS
  are observed at nginx.
links:
- title: Overview
  url: /grafana/d/soloapp-overview
  type: link
  keepTime: true
  includeVars: false
- title: auth
  url: /grafana/d/soloapp-auth
  type: link
  keepTime: true
  includeVars: false
- title: app-api
  url: /grafana/d/soloapp-whoami
  type: link
  keepTime: true
  includeVars: false
- title: nginx
  url: /grafana/d/soloapp-nginx
  type: link
  keepTime: true
  includeVars: false
- title: Infrastructure
  url: /grafana/d/soloapp-infrastructure
  type: link
  keepTime: true
  includeVars: false
- title: Routing chain
  url: /grafana/d/soloapp-routing
  type: link
  keepTime: true
  includeVars: false
- title: PostgreSQL
  url: /grafana/d/soloapp-postgres
  type: link
  keepTime: true
  includeVars: false
templating:
  list:
  - name: dc
    type: custom
    query: yc,home
    multi: true
    includeAll: true
    allValue: .+
    current:
      text: All
      value: $__all
  - name: pod
    type: query
    datasource:
      type: prometheus
      uid: prometheus
    query: label_values(probe_success{service="whoami",dc=~"$dc"},pod)
    refresh: 2
    multi: true
    includeAll: true
    allValue: whoami-.+
    current:
      text: All
      value: $__all
  - name: route
    type: query
    datasource:
      type: prometheus
      uid: prometheus
    query: label_values(soloapp_http_requests_total{dc=~"$dc",service="whoami"},route)
    refresh: 2
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: search
    type: textbox
    query: .*
    current:
      text: .*
      value: .*
panels:
- id: 19
  title: 'О дашборде: app-api'
  type: text
  gridPos:
    x: 0
    y: 0
    w: 24
    h: 4
  options:
    mode: markdown
    content: 'NestJS app-api: получение user-id, HTTP ошибки и задержки, доступность и ресурсы подов (имя workload: whoami).


      Вверху — активные алерты и доля успешных операций. Красный алерт означает firing; пороги хранятся в соседних alerts.yaml.'
  targets: []
- id: 20
  title: Активные алерты
  description: Число firing-инстансов алертов; отдельный pod или контейнер считается отдельно.
  type: stat
  datasource: &id001
    type: prometheus
    uid: prometheus
  gridPos:
    x: 0
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: count(ALERTS{alertstate="firing",project="soloapp",service="app-api",dc=~"$dc"}) or vector(0)
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: short
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: green
          value: null
        - color: red
          value: 1
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- id: 21
  title: Success RPS / (Success RPS + Fail RPS)
  description: 'HTTP 1xx–3xx / все 1xx–5xx. При отсутствии трафика — нет данных. Источник: access log nginx.'
  type: stat
  datasource: *id001
  gridPos:
    x: 12
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: (sum(rate(soloapp_http_requests_total{dc=~"$dc",service="whoami",status=~"[1-3].."}[$__rate_interval])) or
      0 * sum(rate(soloapp_http_requests_total{dc=~"$dc",service="whoami",status=~"[1-5].."}[$__rate_interval]))) / sum(rate(soloapp_http_requests_total{dc=~"$dc",service="whoami",status=~"[1-5].."}[$__rate_interval]))
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: percentunit
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 0.95
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- title: /healthz — availability per pod
  type: state-timeline
  description: Real HTTP GET from local Alloy every 5s. Only 200 is healthy. STALE means sample age >=20s; gaps mean
    missing data, not success. Independent of kubelet probes.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_success{dc=~"$dc",service="whoami",pod=~"$pod",check="healthz"} * (time() - timestamp(probe_success{dc=~"$dc",service="whoami",pod=~"$pod",check="healthz"})
      < bool 20) + 2 * (time() - timestamp(probe_success{dc=~"$dc",service="whoami",pod=~"$pod",check="healthz"}) >=
      bool 20)
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
      min: 0
      max: 2
      mappings:
      - type: value
        options:
          '0':
            text: DOWN
            color: red
          '1':
            text: UP
            color: green
          '2':
            text: STALE
            color: orange
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
        - color: orange
          value: 2
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 1
  gridPos:
    x: 0
    y: 8
    w: 12
    h: 8
- title: /healthz — response time
  type: timeseries
  description: /healthz — response time. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_duration_seconds{dc=~"$dc",service="whoami",pod=~"$pod",check="healthz"}
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 2
  gridPos:
    x: 12
    y: 8
    w: 12
    h: 8
