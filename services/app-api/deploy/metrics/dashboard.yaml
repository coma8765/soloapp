      or 0 * sum by(dc,route)(rate(soloapp_http_requests_total{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval])))
      / clamp_min(sum by(dc,route)(rate(soloapp_http_requests_total{dc=~"$dc",route=~"$route",service="whoami"}[$__rate_interval])),
      0.000001)
