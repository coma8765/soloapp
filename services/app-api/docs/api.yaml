openapi: 3.0.3
info:
  title: Soloapp app-api
  version: 1.0.0
paths:
  /api/v1/app-api/v1/user-id:
    get:
      operationId: user_id
      x-backend-aliases:
      - /user-id
      description: 'Internal endpoint: nginx supplies HMAC-signed identity. Public
        clients use Bearer at the gateway.'
      parameters:
      - name: X-Verified-User-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      - name: X-User-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
      - name: X-User-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserId'
        '401':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      x-route:
        exposure: public
        auth: signed-user
        max_body_bytes: 8192
        timeouts:
          connect_seconds: 2
          read_seconds: 15
        rate_limit: null
  /health/ready:
    get:
      operationId: health_ready
      description: Internal process health probe; excluded from 5xx accounting.
      responses:
        '200':
          description: Process health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Process health
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Status'
                - $ref: '#/components/schemas/Error'
      security: []
      x-route:
        exposure: internal
        auth: none
        max_body_bytes: 8192
        timeouts:
          connect_seconds: 2
          read_seconds: 15
        rate_limit: null
  /healthz:
    get:
      operationId: healthz
      description: Internal process health probe; excluded from 5xx accounting.
      responses:
        '200':
          description: Process health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Process health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      security: []
      x-route:
        exposure: internal
        auth: none
        max_body_bytes: 8192
        timeouts:
          connect_seconds: 2
          read_seconds: 15
        rate_limit: null
  /api/v1/app-api/v1/chat/messages:
    get:
      operationId: chat_messages
      security:
      - bearerAuth: []
      x-route:
        exposure: public
        auth: signed-user
        max_body_bytes: 8192
        timeouts: &id001
          connect_seconds: 2
          read_seconds: 10
        rate_limit: &id002
          group: chat
          requests_per_second: 10
          burst: 20
      responses:
        '200':
          description: ChatHistory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistory'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: chat_send
      security:
      - bearerAuth: []
      x-route:
        exposure: public
        auth: signed-user
        max_body_bytes: 8192
        timeouts: *id001
        rate_limit: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSend'
      responses:
        '201':
          description: ChatMessage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/app-api/v1/chat/socket-ticket:
    post:
      operationId: chat_socket_ticket
      description: Single-use WebSocket ticket, valid for 30 seconds. Issued only
        after session verification.
      security:
      - bearerAuth: []
      x-route:
        exposure: public
        auth: signed-user
        max_body_bytes: 8192
        timeouts:
          connect_seconds: 2
          read_seconds: 10
        rate_limit: &id003
          group: chat
          requests_per_second: 10
          burst: 20
      responses:
        '201':
          description: ChatSocketTicket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSocketTicket'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/app-api/v1/chat/ws:
    get:
      operationId: chat_socket
      description: 'WebSocket delivery: soloapp.chat.v1 and ticket.<ticket> subprotocols.
        Ticket consumed atomically before upgrade. Server sends history, message and
        ping JSON frames; closes after 60 seconds to revalidate the session on reconnect.
        Sends remain idempotent HTTP POST chat/messages.'
      security: []
      x-websocket: true
      x-upstream: client-gateway
      x-route:
        exposure: public
        auth: none
        max_body_bytes: 8192
        timeouts:
          connect_seconds: 2
          read_seconds: 45
        rate_limit: *id003
      responses:
        '101':
          description: Authenticated WebSocket stream
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserId:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          pattern: ^[0-9a-f]{32}$
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Status:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    ChatSend:
      type: object
      additionalProperties: false
      required:
      - text
      - client_id
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        client_id:
          type: string
          pattern: ^[0-9a-f]{32}$
    ChatMessage:
      type: object
      required:
      - id
      - user_id
      - text
      - sent_at
      properties:
        id:
          type: string
        user_id:
          type: string
        text:
          type: string
        sent_at:
          type: integer
    ChatHistory:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatSocketTicket:
      type: object
      required:
      - ticket
      - expires_in
      properties:
        ticket:
          type: string
          pattern: ^[0-9a-f]{64}$
        expires_in:
          type: integer
