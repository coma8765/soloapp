apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: soloapp-nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: soloapp-nvidia-device-plugin}
  template:
    metadata:
      labels: {app: soloapp-nvidia-device-plugin}
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
      - name: device-plugin
        image: soloapp/nvidia-device-plugin:v0.17.1-source
        imagePullPolicy: Never
        env:
        - {name: FAIL_ON_INIT_ERROR, value: 'true'}
        - {name: NVIDIA_VISIBLE_DEVICES, value: all}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        volumeMounts:
        - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
      volumes:
      - name: device-plugin
        hostPath: {path: /var/lib/kubelet/device-plugins, type: Directory}
