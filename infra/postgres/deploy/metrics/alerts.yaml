groups:
- name: soloapp.postgres
  rules:
  - record: soloapp:postgres:connection_ratio
    expr: max by(dc)((sum by(dc,observer)(solo_pg_connections_count{job="postgres"}) / max by(dc,observer)(solo_pg_node_max_connections{job="postgres"}))
      and on(dc,observer) ((max by(dc,observer)(pg_up{job="postgres"}) == 1) and on(dc,observer) (max by(dc,observer)(pg_exporter_last_scrape_error{job="postgres"})
      == 0) and on(dc,observer) (time()-max by(dc,observer)(timestamp(pg_up{job="postgres"})) < 20)))
  - alert: PostgresConnectionsHigh
    expr: soloapp:postgres:connection_ratio > 0.7
    for: 3m
    labels:
      severity: warning
      project: soloapp
      service: postgres
    annotations:
      summary: 'PostgreSQL: занято больше 70% соединений'
      description: Использовано {{ $value | humanizePercentage }} max_connections по всем базам; порог >70% сохраняется 3
        минуты.
      action: Проверьте число active/idle соединений, долгие транзакции и размеры пулов приложений. Не увеличивайте max_connections
        без оценки памяти.
    keep_firing_for: 3m
