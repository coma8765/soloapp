- name: Install independent S3 replica in each site
  hosts: app_sites
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars:
    s3_config: "{{ lookup('file', project_root ~ '/infra/object-storage/defaults.yaml') | from_yaml | combine(s3_overrides | default({}), recursive=true) }}"
  tasks:
  - name: Update Lockbox helper with S3 reload support
    ansible.builtin.copy:
      src: '{{ project_root }}/infra/secrets/files/secret-fetch.py'
      dest: '{{ remote_root }}/secret-fetch.py'
      mode: '0700'
    register: s3_helper
  - name: Deliver scoped S3 server configuration
    ansible.builtin.include_tasks: ../secrets/tasks/delivery.yaml
    vars:
      delivery_name: s3server
      delivery_uid: 10005
      delivery_secret_ids: "{{ cloud.secrets['s3-server'] }}"
      delivery_helper: '{{ s3_helper }}'
  - name: Deliver scoped publication key in RAM for CD
    ansible.builtin.include_tasks: ../secrets/tasks/delivery.yaml
    vars:
      delivery_name: s3publisher
      delivery_uid: 10004
      delivery_secret_ids: "{{ cloud.secrets['s3-publisher'] }}"
      delivery_helper: '{{ s3_helper }}'
  - name: Create persistent S3 volume directory
    ansible.builtin.file:
      path: '{{ s3_config.data_path }}'
      state: directory
      owner: '10005'
      group: '10005'
      mode: '0700'
  - name: Refresh S3 secrets before cutover
    ansible.builtin.systemd_service:
      name: solo-s3server-secrets
      state: started
  - name: Discover the storage node
    ansible.builtin.command: k3s kubectl get nodes -o jsonpath='{.items[0].metadata.name}'
    register: s3_node_name
    changed_when: false
  - name: Preload the pinned image before interrupting storage
    ansible.builtin.command:
      argv: [k3s, crictl, pull, '{{ s3_config.image }}']
    changed_when: false
  - name: Render Kubernetes storage resources
    ansible.builtin.template:
      src: k8s/seaweedfs.yaml.j2
      dest: '{{ remote_root }}/seaweedfs.yaml'
      mode: '0600'
  - name: Validate storage resources before stopping Docker
    ansible.builtin.command:
      argv: [k3s, kubectl, apply, --dry-run=server, -f, '{{ remote_root }}/seaweedfs.yaml']
    changed_when: false
  - name: Install content verification tool
    ansible.builtin.copy:
      src: verify_migration.py
      dest: '{{ remote_root }}/s3-verify-migration.py'
      mode: '0644'
  - name: Migrate under the deployment lock with automatic runtime rollback
    ansible.builtin.shell: |
      set -eu
      exec 9>/var/lib/soloapp-cd/deploy.lock
      flock -w 30 9
      old_running=$(docker inspect solo-s3 --format '{{ '{{' }}.State.Running{{ '}}' }}' 2>/dev/null || true)
      rollback() {
        if [ "$old_running" = true ]; then
          k3s kubectl -n soloapp scale statefulset/seaweedfs --replicas=0 || true
          if k3s kubectl -n soloapp wait --for=delete pod/seaweedfs-0 --timeout=120s; then
            docker update --restart=unless-stopped solo-s3
            docker start solo-s3
          fi
        fi
      }
      trap rollback EXIT
      verify_storage() {
        docker run --rm --user 0:0 --network host --entrypoint python3 \
          -v /run/soloapp-s3server:/secrets:ro \
          -v /var/backups/soloapp-s3:/snapshots \
          -v '{{ remote_root }}/s3-verify-migration.py:/verify.py:ro' \
          soloapp/deploy-controller:1 /verify.py 'http://{{ private_ip }}:18333' \
          --snapshot "/snapshots/$snapshot" "$@"
      }
      if [ "$old_running" = true ]; then
        install -d -m 700 /var/backups/soloapp-s3
        snapshot=pre-k8s-$(date +%s)-inventory.json
        verify_storage
        docker update --restart=no solo-s3
        docker stop --time 60 solo-s3
        install -d -m 700 /var/backups/soloapp-s3
        backup=/var/backups/soloapp-s3/pre-k8s-$(date +%s).tar
        umask 077
        tar -C '{{ s3_config.data_path }}' -cf "$backup" .
        tar -tf "$backup" >/dev/null
      fi
      k3s kubectl apply -f '{{ remote_root }}/seaweedfs.yaml'
      k3s kubectl -n soloapp rollout status statefulset/seaweedfs --timeout=360s
      if [ "$old_running" = true ]; then
        verify_storage --verify
      fi
      trap - EXIT
    args: {executable: /bin/bash}
    changed_when: true
  - name: Wait for S3 listener
    ansible.builtin.wait_for:
      host: '{{ private_ip }}'
      port: 18333
      timeout: 60
  - name: Install bucket bootstrap script
    ansible.builtin.copy:
      src: init-bucket.py
      dest: '{{ remote_root }}/s3-init-bucket.py'
      mode: '0644'
  - name: Initialize local bucket with object versioning
    ansible.builtin.command:
      argv:
      - docker
      - run
      - --rm
      - --user
      - '10005:10005'
      - --network
      - host
      - --entrypoint
      - python3
      - -v
      - /run/soloapp-s3server:/secrets:ro
      - -v
      - '{{ remote_root }}/s3-init-bucket.py:/init.py:ro'
      - soloapp/deploy-controller:1
      - /init.py
      - 'http://{{ private_ip }}:18333'
    changed_when: true
