# Operator-only upgrade of the installed gate; no SSH/sudo/RBAC scope changes.
- name: Upgrade fixed CD gate for versioned web bundles
  hosts: app_sites
  gather_facts: false
  become: true
  tasks:
  - name: Install updated controller build files
    ansible.builtin.copy:
      src: '{{ item }}'
      dest: '/etc/soloapp-cd/{{ item }}'
      mode: '0644'
    loop: [Dockerfile, k3s-controller.sh]
  - name: Rebuild controller with S3 SDK
    ansible.builtin.command: docker build -t soloapp/deploy-controller:1 /etc/soloapp-cd
    changed_when: true
  - name: Update gate and command parser
    ansible.builtin.copy:
      src: '{{ item.src }}'
      dest: '{{ item.dest }}'
      owner: root
      group: root
      mode: '0755'
    loop:
    - {src: deploy.py, dest: /usr/local/libexec/soloapp-cd}
    - {src: entry.py, dest: /usr/local/libexec/soloapp-cd-entry}
  - name: Update resource identifiers
    ansible.builtin.copy:
      src: '{{ project_root }}/infra/cloud/resources.json'
      dest: /etc/soloapp-cd/resources.json
      mode: '0600'
