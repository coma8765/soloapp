# Operator-only upgrade of the installed gate; no SSH/sudo/RBAC scope changes.
- name: Upgrade fixed CD gate for versioned web bundles
  hosts: app_sites
  gather_facts: false
  become: true
  tasks:
  - name: Require prebuilt controller (built locally or in GitHub CI)
    ansible.builtin.command: docker image inspect soloapp/deploy-controller:1
    changed_when: false
    no_log: true
  - name: Update gate and command parser
    ansible.builtin.copy:
      src: '{{ item.src }}'
      dest: '{{ item.dest }}'
      owner: root
      group: root
      mode: '0755'
    loop:
    - {src: deploy.py, dest: /usr/local/libexec/soloapp-cd}
    - {src: entry.py, dest: /usr/local/libexec/soloapp-cd-entry}
  - name: Update resource identifiers
    ansible.builtin.copy:
      src: '{{ project_root }}/infra/cloud/resources.json'
      dest: /etc/soloapp-cd/resources.json
      mode: '0600'
