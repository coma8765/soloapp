id: null
uid: soloapp-infrastructure
title: Soloapp · Infrastructure
schemaVersion: 39
version: 3
refresh: 5s
timezone: browser
time:
  from: now-1h
  to: now
tags:
- soloapp
- lite
description: Per-pod HTTP health probes and service-specific telemetry. Missing data is not success. Business HTTP latency/RPS
  are observed at nginx.
links:
- title: Overview
  url: /grafana/d/soloapp-overview
  type: link
  keepTime: true
  includeVars: false
- title: auth
  url: /grafana/d/soloapp-auth
  type: link
  keepTime: true
  includeVars: false
- title: app-api
  url: /grafana/d/soloapp-whoami
  type: link
  keepTime: true
  includeVars: false
- title: nginx
  url: /grafana/d/soloapp-nginx
  type: link
  keepTime: true
  includeVars: false
- title: Infrastructure
  url: /grafana/d/soloapp-infrastructure
  type: link
  keepTime: true
  includeVars: false
- title: Routing chain
  url: /grafana/d/soloapp-routing
  type: link
  keepTime: true
  includeVars: false
- title: PostgreSQL
  url: /grafana/d/soloapp-postgres
  type: link
  keepTime: true
  includeVars: false
templating:
  list:
  - name: dc
    type: custom
    query: yc,home
    multi: true
    includeAll: true
    allValue: .+
    current:
      text: All
      value: $__all
panels:
- id: 7
  title: 'О дашборде: Soloapp · Infrastructure'
  type: text
  gridPos:
    x: 0
    y: 0
    w: 24
    h: 4
  options:
    mode: markdown
    content: 'Состояние Kubernetes и мониторинга: узлы, сбор метрик, ресурсы и алерты инфраструктуры. HTTP success ratio
      ниже относится к общему входящему трафику приложения.


      Вверху — активные алерты и доля успешных операций. Красный алерт означает firing; пороги хранятся в соседних alerts.yaml.'
  targets: []
- id: 8
  title: Активные алерты
  description: Число firing-инстансов алертов; отдельный pod или контейнер считается отдельно.
  type: stat
  datasource: &id001
    type: prometheus
    uid: prometheus
  gridPos:
    x: 0
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: count(ALERTS{alertstate="firing",project="soloapp",service!~"auth|app-api|nginx|web|postgres|routing",dc=~"$dc"})
      or vector(0)
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: short
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: green
          value: null
        - color: red
          value: 1
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- id: 9
  title: Success RPS / (Success RPS + Fail RPS)
  description: 'HTTP 1xx–3xx / все 1xx–5xx. При отсутствии трафика — нет данных. Источник: access log nginx.'
  type: stat
  datasource: *id001
  gridPos:
    x: 12
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: (sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-3].."}[$__rate_interval])) or 0 * sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-5].."}[$__rate_interval])))
      / sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-5].."}[$__rate_interval]))
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: percentunit
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 0.95
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- title: Node Ready
  type: timeseries
  description: Node Ready. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: kube_node_status_condition{condition="Ready",status="true",dc=~"$dc"}
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
      min: 0
      max: 2
      mappings:
      - type: value
        options:
          '0':
            text: DOWN
            color: red
          '1':
            text: UP
            color: green
          '2':
            text: STALE
            color: orange
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
        - color: orange
          value: 2
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 1
  gridPos:
    x: 0
    y: 8
    w: 12
    h: 8
- title: Scrape targets
  type: timeseries
  description: Scrape targets. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: up{job=~"alloy|cadvisor|kube-state-metrics",dc=~"$dc"}
    legendFormat: '{{dc}} {{job}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
      min: 0
      max: 2
      mappings:
      - type: value
        options:
          '0':
            text: DOWN
            color: red
          '1':
            text: UP
            color: green
          '2':
            text: STALE
            color: orange
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
        - color: orange
          value: 2
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 2
  gridPos:
    x: 12
    y: 8
    w: 12
    h: 8
- title: Agent sample age
  type: timeseries
  description: Agent sample age. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: time() - max by(dc)(timestamp(up{job="alloy",dc=~"$dc"}))
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 3
  gridPos:
    x: 0
    y: 16
    w: 12
    h: 8
- title: HTTP probe count by service
  type: timeseries
  description: HTTP probe count by service. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: count by(dc,service,check)(probe_success{dc=~"$dc"})
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 4
  gridPos:
    x: 12
    y: 16
    w: 12
    h: 8
- title: Monitoring container CPU
  type: timeseries
  description: Monitoring container CPU. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: sum by(dc,pod,container)(rate(container_cpu_usage_seconds_total{namespace="observability",container!="",container!="POD",dc=~"$dc"}[$__rate_interval]))
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: cores
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 5
  gridPos:
    x: 0
    y: 24
    w: 12
    h: 8
- title: Monitoring container memory
  type: timeseries
  description: Monitoring container memory. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: container_memory_working_set_bytes{namespace="observability",container!="",container!="POD",dc=~"$dc"}
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: bytes
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 6
  gridPos:
    x: 12
    y: 24
    w: 12
    h: 8
