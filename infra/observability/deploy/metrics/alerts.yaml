groups:
- name: soloapp.observability
  rules:
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="yc"}[1m]) or (max(up{job="alloy",dc="yc"}) == 0))
    for: 1m
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: yc
    annotations:
      summary: Нет свежих метрик площадки
      description: Alloy недоступен не менее 1 минуты либо метрики не поступают. Состояние площадки по мониторингу неполное.
      action: Проверьте Alloy, WireGuard и remote_write. Отсутствие метрик не означает восстановление сервисов.
    keep_firing_for: 3m
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="home"}[1m]) or (max(up{job="alloy",dc="home"}) == 0))
    for: 1m
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: home
    annotations:
      summary: Нет свежих метрик площадки
      description: Alloy недоступен не менее 1 минуты либо метрики не поступают. Состояние площадки по мониторингу неполное.
      action: Проверьте Alloy, WireGuard и remote_write. Отсутствие метрик не означает восстановление сервисов.
    keep_firing_for: 3m
  - alert: TelegramDeliveryFailed
    expr: sum by(dc)(increase(alertmanager_notifications_failed_total{integration="webhook"}[5m])) >= 3
    for: 1m
    labels:
      severity: warning
      project: soloapp
      service: observability
    annotations:
      summary: Повторяются ошибки доставки уведомлений
      description: 'За 5 минут: около {{ printf "%.0f" $value }} ошибок webhook, порог ≥3 сохраняется 1 минуту. Часть уведомлений
        может задерживаться.'
      action: Проверьте Alertmanager, доступность Cloudflare relay и Telegram. Не публикуйте токены или полный URL Telegram
        API в логах.
    keep_firing_for: 3m
