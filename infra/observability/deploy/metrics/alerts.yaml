groups:
- name: soloapp.observability
  rules:
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="yc"}[1m]) or (max(up{job="alloy",dc="yc"}) == 0))
    for: 1m
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: yc
    annotations:
      summary: Нет свежих метрик площадки
      description: Alloy недоступен не менее 1 минуты либо метрики не поступают. Состояние площадки по мониторингу неполное.
      action: Проверьте Alloy, WireGuard и remote_write. Отсутствие метрик не означает восстановление сервисов.
    keep_firing_for: 3m
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="home"}[1m]) or (max(up{job="alloy",dc="home"}) == 0))
    for: 1m
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: home
    annotations:
      summary: Нет свежих метрик площадки
      description: Alloy недоступен не менее 1 минуты либо метрики не поступают. Состояние площадки по мониторингу неполное.
      action: Проверьте Alloy, WireGuard и remote_write. Отсутствие метрик не означает восстановление сервисов.
    keep_firing_for: 3m
  - alert: TelegramDeliveryFailed
    expr: sum by(dc)(increase(alertmanager_notifications_failed_total{integration="webhook"}[5m])) >= 3
    for: 1m
    labels:
      severity: warning
      project: soloapp
      service: observability
    annotations:
      summary: Повторяются ошибки доставки уведомлений
      description: 'За 5 минут: около {{ printf "%.0f" $value }} ошибок webhook, порог ≥3 сохраняется 1 минуту. Часть уведомлений
        может задерживаться.'
      action: Проверьте Alertmanager, доступность Cloudflare relay и Telegram. Не публикуйте токены или полный URL Telegram
        API в логах.
    keep_firing_for: 3m
  - alert: HAProxyScrapeFailed
    expr: (min by(observer, ingress) (up{job="haproxy",observer="yc",ingress="yc"}) == 0) or absent_over_time(up{job="haproxy",observer="yc",ingress="yc"}[1m])
    for: 1m
    keep_firing_for: 3m
    labels:
      severity: warning
      project: soloapp
      service: observability
      dc: yc
      observer: yc
      ingress: yc
    annotations:
      summary: Недоступен сбор метрик HAProxy
      description: 'Наблюдатель yc не получает метрики HAProxy yc: scrape неуспешен 1 минуту либо серия отсутствует (окно
        1 минута + выдержка 1 минута). Успех другой площадки не скрывает этот отказ.'
      action: Проверьте цель ingress в Alloy, NetworkPolicy после Docker DNAT, WireGuard и mTLS сертификаты. Не отключайте
        проверку TLS.
      dashboard_url: https://soloapp.secure-l3.stream/grafana/
      runbook_url: https://github.com/coma8765/soloapp/blob/main/infra/observability/deploy/metrics/README.md#haproxyscrapefailed
  - alert: HAProxyScrapeFailed
    expr: (min by(observer, ingress) (up{job="haproxy",observer="yc",ingress="edge"}) == 0) or absent_over_time(up{job="haproxy",observer="yc",ingress="edge"}[1m])
    for: 1m
    keep_firing_for: 3m
    labels:
      severity: warning
      project: soloapp
      service: observability
      dc: yc
      observer: yc
      ingress: edge
    annotations:
      summary: Недоступен сбор метрик HAProxy
      description: 'Наблюдатель yc не получает метрики HAProxy edge: scrape неуспешен 1 минуту либо серия отсутствует (окно
        1 минута + выдержка 1 минута). Успех другой площадки не скрывает этот отказ.'
      action: Проверьте цель ingress в Alloy, NetworkPolicy после Docker DNAT, WireGuard и mTLS сертификаты. Не отключайте
        проверку TLS.
      dashboard_url: https://soloapp.secure-l3.stream/grafana/
      runbook_url: https://github.com/coma8765/soloapp/blob/main/infra/observability/deploy/metrics/README.md#haproxyscrapefailed
  - alert: HAProxyScrapeFailed
    expr: (min by(observer, ingress) (up{job="haproxy",observer="home",ingress="yc"}) == 0) or absent_over_time(up{job="haproxy",observer="home",ingress="yc"}[1m])
    for: 1m
    keep_firing_for: 3m
    labels:
      severity: warning
      project: soloapp
      service: observability
      dc: home
      observer: home
      ingress: yc
    annotations:
      summary: Недоступен сбор метрик HAProxy
      description: 'Наблюдатель home не получает метрики HAProxy yc: scrape неуспешен 1 минуту либо серия отсутствует (окно
        1 минута + выдержка 1 минута). Успех другой площадки не скрывает этот отказ.'
      action: Проверьте цель ingress в Alloy, NetworkPolicy после Docker DNAT, WireGuard и mTLS сертификаты. Не отключайте
        проверку TLS.
      dashboard_url: https://soloapp.secure-l3.stream/grafana/
      runbook_url: https://github.com/coma8765/soloapp/blob/main/infra/observability/deploy/metrics/README.md#haproxyscrapefailed
  - alert: HAProxyScrapeFailed
    expr: (min by(observer, ingress) (up{job="haproxy",observer="home",ingress="edge"}) == 0) or absent_over_time(up{job="haproxy",observer="home",ingress="edge"}[1m])
    for: 1m
    keep_firing_for: 3m
    labels:
      severity: warning
      project: soloapp
      service: observability
      dc: home
      observer: home
      ingress: edge
    annotations:
      summary: Недоступен сбор метрик HAProxy
      description: 'Наблюдатель home не получает метрики HAProxy edge: scrape неуспешен 1 минуту либо серия отсутствует (окно
        1 минута + выдержка 1 минута). Успех другой площадки не скрывает этот отказ.'
      action: Проверьте цель ingress в Alloy, NetworkPolicy после Docker DNAT, WireGuard и mTLS сертификаты. Не отключайте
        проверку TLS.
      dashboard_url: https://soloapp.secure-l3.stream/grafana/
      runbook_url: https://github.com/coma8765/soloapp/blob/main/infra/observability/deploy/metrics/README.md#haproxyscrapefailed
