groups:
- name: soloapp.observability
  rules:
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="yc"}[1m]) or (max(up{job="alloy",dc="yc"}) == 0))
    for: 0s
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: yc
    annotations:
      summary: Нет свежих метрик ДЦ
      description: DC={{ $labels.dc }} service={{ $labels.service }} namespace={{ $labels.namespace }} pod={{ $labels.pod
        }} container={{ $labels.container }} route={{ $labels.route }} value={{ $value }}
  - alert: MonitoringAgentMissing
    expr: (absent_over_time(up{job="alloy",dc="home"}[1m]) or (max(up{job="alloy",dc="home"}) == 0))
    for: 0s
    labels:
      severity: critical
      project: soloapp
      service: observability
      dc: home
    annotations:
      summary: Нет свежих метрик ДЦ
      description: DC={{ $labels.dc }} service={{ $labels.service }} namespace={{ $labels.namespace }} pod={{ $labels.pod
        }} container={{ $labels.container }} route={{ $labels.route }} value={{ $value }}
  - alert: TelegramDeliveryFailed
    expr: sum by(dc)(increase(alertmanager_notifications_failed_total{integration="webhook"}[5m])) > 0
    for: 0s
    labels:
      severity: warning
      project: soloapp
      service: observability
    annotations:
      summary: Ошибка доставки Telegram
      description: DC={{ $labels.dc }} service={{ $labels.service }} namespace={{ $labels.namespace }} pod={{ $labels.pod
        }} container={{ $labels.container }} route={{ $labels.route }} value={{ $value }}
