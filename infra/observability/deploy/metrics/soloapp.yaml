id: null
uid: soloapp-overview
title: Soloapp · Overview
schemaVersion: 39
version: 3
refresh: 5s
timezone: browser
time:
  from: now-1h
  to: now
tags:
- soloapp
- lite
description: Per-pod HTTP health probes and service-specific telemetry. Missing data is not success. Business HTTP latency/RPS
  are observed at nginx.
links:
- title: Overview
  url: /grafana/d/soloapp-overview
  type: link
  keepTime: true
  includeVars: false
- title: auth
  url: /grafana/d/soloapp-auth
  type: link
  keepTime: true
  includeVars: false
- title: app-api
  url: /grafana/d/soloapp-whoami
  type: link
  keepTime: true
  includeVars: false
- title: nginx
  url: /grafana/d/soloapp-nginx
  type: link
  keepTime: true
  includeVars: false
- title: Infrastructure
  url: /grafana/d/soloapp-infrastructure
  type: link
  keepTime: true
  includeVars: false
- title: Routing chain
  url: /grafana/d/soloapp-routing
  type: link
  keepTime: true
  includeVars: false
- title: PostgreSQL
  url: /grafana/d/soloapp-postgres
  type: link
  keepTime: true
  includeVars: false
templating:
  list:
  - name: dc
    type: custom
    query: yc,home
    multi: true
    includeAll: true
    allValue: .+
    current:
      text: All
      value: $__all
panels:
- id: 9
  title: 'О дашборде: Soloapp · Overview'
  type: text
  gridPos:
    x: 0
    y: 0
    w: 24
    h: 4
  options:
    mode: markdown
    content: 'Общее состояние авторизации и маршрута до подов: доступность /healthz, готовность, реплики и бизнес-трафик.


      Вверху — активные алерты и доля успешных операций. Красный алерт означает firing; пороги хранятся в соседних alerts.yaml.'
  targets: []
- id: 10
  title: Активные алерты
  description: Число firing-инстансов алертов; отдельный pod или контейнер считается отдельно.
  type: stat
  datasource: &id001
    type: prometheus
    uid: prometheus
  gridPos:
    x: 0
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: (count(ALERTS{alertstate="firing",project="soloapp",dc=~"$dc"}) or vector(0)) + (count(ALERTS{alertstate="firing",project="soloapp",dc=""})
      or vector(0))
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: short
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: green
          value: null
        - color: red
          value: 1
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- id: 11
  title: Success RPS / (Success RPS + Fail RPS)
  description: 'HTTP 1xx–3xx / все 1xx–5xx. При отсутствии трафика — нет данных. Источник: access log nginx.'
  type: stat
  datasource: *id001
  gridPos:
    x: 12
    y: 4
    w: 12
    h: 4
  targets:
  - refId: A
    expr: (sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-3].."}[$__rate_interval])) or 0 * sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-5].."}[$__rate_interval])))
      / sum(rate(soloapp_http_requests_total{dc=~"$dc",status=~"[1-5].."}[$__rate_interval]))
    instant: true
    datasource: *id001
  fieldConfig:
    defaults:
      unit: percentunit
      noValue: Нет данных
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 0.95
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
- title: /healthz — availability per pod
  type: state-timeline
  description: Real HTTP GET from local Alloy every 5s. Only 200 is healthy. STALE means sample age >=20s; gaps mean
    missing data, not success. Independent of kubelet probes.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_success{dc=~"$dc",check="healthz"} * (time() - timestamp(probe_success{dc=~"$dc",check="healthz"}) <
      bool 20) + 2 * (time() - timestamp(probe_success{dc=~"$dc",check="healthz"}) >= bool 20)
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
      min: 0
      max: 2
      mappings:
      - type: value
        options:
          '0':
            text: DOWN
            color: red
          '1':
            text: UP
            color: green
          '2':
            text: STALE
            color: orange
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
        - color: orange
          value: 2
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 1
  gridPos:
    x: 0
    y: 8
    w: 12
    h: 8
- title: /healthz — response time
  type: timeseries
  description: /healthz — response time. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_duration_seconds{dc=~"$dc",check="healthz"}
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 2
  gridPos:
    x: 12
    y: 8
    w: 12
    h: 8
- title: /healthz — HTTP status
  type: timeseries
  description: 0 means no HTTP response (timeout, connection or transport failure). Expected 200.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_http_status_code{dc=~"$dc",check="healthz"}
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 3
  gridPos:
    x: 0
    y: 16
    w: 12
    h: 8
- title: /healthz — last sample age
  type: timeseries
  description: Time since last received probe sample; >20s is stale.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: time() - timestamp(probe_success{dc=~"$dc",check="healthz"})
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 4
  gridPos:
    x: 12
    y: 16
    w: 12
    h: 8
- title: Readiness — accepting traffic
  type: state-timeline
  description: 'Auth/whoami: /health/ready (includes 5xx cooldown); nginx: /healthz. Kubelet independently controls Service
    endpoints.'
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: probe_success{dc=~"$dc",check="readiness"} * (time() - timestamp(probe_success{dc=~"$dc",check="readiness"})
      < bool 20) + 2 * (time() - timestamp(probe_success{dc=~"$dc",check="readiness"}) >= bool 20)
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
      min: 0
      max: 2
      mappings:
      - type: value
        options:
          '0':
            text: DOWN
            color: red
          '1':
            text: UP
            color: green
          '2':
            text: STALE
            color: orange
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
        - color: orange
          value: 2
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 5
  gridPos:
    x: 0
    y: 24
    w: 12
    h: 8
- title: Available / desired replicas
  type: timeseries
  description: Available / desired replicas. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: kube_deployment_status_replicas_available{namespace="soloapp",dc=~"$dc"}
    legendFormat: '{{dc}} {{deployment}} available'
    datasource:
      type: prometheus
      uid: prometheus
  - refId: B
    expr: kube_deployment_spec_replicas{namespace="soloapp",dc=~"$dc"}
    legendFormat: '{{dc}} {{deployment}} desired'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: short
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 6
  gridPos:
    x: 12
    y: 24
    w: 12
    h: 8
- title: Business RPS by service
  type: timeseries
  description: Business RPS by service. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: sum by(dc,service)(rate(soloapp_http_requests_total{dc=~"$dc"}[$__rate_interval]))
    legendFormat: '{{dc}} {{service}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: reqps
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 7
  gridPos:
    x: 0
    y: 32
    w: 12
    h: 8
- title: Agent sample age
  type: timeseries
  description: Agent sample age. Данные выбранных ДЦ; каждая линия соответствует меткам в легенде.
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: time() - max by(dc)(timestamp(up{job="alloy",dc=~"$dc"}))
    legendFormat: '{{dc}} {{pod}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: s
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 8
  gridPos:
    x: 12
    y: 32
    w: 12
    h: 8
