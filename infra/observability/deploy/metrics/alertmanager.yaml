global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by:
  - alertname
  - dc
  - service
  group_wait: '{{ obs.alertmanager.group_wait }}'
  group_interval: '{{ obs.alertmanager.group_interval }}'
  repeat_interval: '{{ obs.alertmanager.repeat_interval }}'
  routes:
  - matchers: ['severity="critical"']
    group_wait: '{{ obs.alertmanager.critical_group_wait }}'
  - matchers: ['severity="warning"']
    group_wait: '{{ obs.alertmanager.warning_group_wait }}'
    group_interval: '{{ obs.alertmanager.warning_group_interval }}'
    repeat_interval: '{{ obs.alertmanager.warning_repeat_interval }}'
receivers:
- name: telegram
  webhook_configs:
  - url: '{{ obs.alertmanager.relay_url | default(cloud.telegram_relay.url, true) }}'
    send_resolved: true
    max_alerts: 100
    timeout: 2m
    http_config:
      follow_redirects: false
      authorization:
        type: Bearer
        credentials_file: /run/soloapp-secrets/data/relay-token
inhibit_rules:
# Keep the most actionable per-pod incident; exact pod identity remains visible.
- source_matchers: ['alertname="PodUnavailable"', 'project="soloapp"']
  target_matchers: ['alertname=~"PodStartupTooLong|PodHealthProbeFailed"', 'project="soloapp"']
  equal: [project, dc, pod]
# Loss of monitoring is the root signal; stale resource/probe symptoms add no information.
- source_matchers: ['alertname="MonitoringAgentMissing"', 'project="soloapp"']
  target_matchers: ['alertname=~"PodHealthProbeFailed|ContainerCpuRequestHigh|ContainerMemoryRequestHigh"', 'project="soloapp"']
  equal: [project, dc]
