global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by:
  - alertname
  - dc
  - service
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
receivers:
- name: telegram
  webhook_configs:
  - url: '{{ obs.alertmanager.relay_url | default(cloud.telegram_relay.url, true) }}'
    send_resolved: true
    max_alerts: 100
    timeout: 2m
    http_config:
      follow_redirects: false
      authorization:
        type: Bearer
        credentials_file: /run/soloapp-secrets/data/relay-token
inhibit_rules:
- source_matchers:
  - alertname="PodStartupTooLong"
  target_matchers:
  - alertname="PodUnavailable"
  equal:
  - dc
  - namespace
  - pod
