- name: Install shared Lockbox delivery agent
  ansible.builtin.copy:
    src: "{{ project_root }}/infra/secrets/files/secret-fetch.py"
    dest: "{{ remote_root }}/secret-fetch.py"
    mode: '0700'
  register: delivery_helper
- name: Deliver database node identity
  ansible.builtin.include_tasks: delivery.yaml
  vars:
    delivery_name: node
    delivery_uid: 999
    delivery_secret_ids: "{{ cloud.secrets['node-' ~ inventory_hostname] }}"
- name: Deliver ingress identity
  ansible.builtin.include_tasks: delivery.yaml
  vars:
    delivery_name: ingress
    delivery_uid: 10002
    delivery_secret_ids: "{{ cloud.secrets['ingress-' ~ inventory_hostname] }},{{ cloud.secrets.https }}"
  when: inventory_hostname in groups['ingress']
