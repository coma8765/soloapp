- name: Configure scoped delivery
  ansible.builtin.template:
    src: "{{ project_root }}/infra/secrets/templates/delivery.env.j2"
    dest: "{{ remote_root }}/{{ delivery_name }}-secrets.env"
    mode: '0600'
  register: delivery_env
- name: Configure delivery unit
  ansible.builtin.template:
    src: "{{ project_root }}/infra/secrets/templates/delivery.service.j2"
    dest: "/etc/systemd/system/solo-{{ delivery_name }}-secrets.service"
    mode: '0644'
  register: delivery_unit
- name: Configure refresh timer
  ansible.builtin.template:
    src: "{{ project_root }}/infra/secrets/templates/delivery.timer.j2"
    dest: "/etc/systemd/system/solo-{{ delivery_name }}-secrets.timer"
    mode: '0644'
  register: delivery_timer
- name: Refresh after delivery configuration change
  ansible.builtin.systemd_service:
    name: "solo-{{ delivery_name }}-secrets"
    daemon_reload: true
    state: started
  when: delivery_env.changed or delivery_unit.changed or delivery_helper.changed
  no_log: true
- name: Enable rotation timer
  ansible.builtin.systemd_service:
    name: "solo-{{ delivery_name }}-secrets.timer"
    daemon_reload: "{{ delivery_timer.changed }}"
    enabled: true
    state: started
