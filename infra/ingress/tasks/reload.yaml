- name: Render candidate ingress configuration
  ansible.builtin.template:
    src: '{{ project_root }}/infra/ingress/templates/haproxy.cfg.j2'
    dest: '{{ remote_root }}/haproxy.candidate.cfg'
    mode: '0644'
- name: Validate candidate using existing TLS identity
  ansible.builtin.command:
    argv: [docker, run, --rm, --user, '10002:10002', --network, host, '-v', '{{ remote_root }}/haproxy.candidate.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro', '-v', '/run/soloapp-ingress:/run/soloapp-ingress:ro', 'haproxy:3.0-alpine', haproxy, '-c', '-f', /usr/local/etc/haproxy/haproxy.cfg]
  changed_when: false
  when: not ansible_check_mode
- name: Update mounted configuration preserving its inode
  ansible.builtin.command:
    argv: [python3, '-c', "import json,pathlib,subprocess; c=json.loads(subprocess.check_output(['docker','inspect','solo-ingress']))[0]; m=next(x for x in c['Mounts'] if x['Destination'] in ('/usr/local/etc/haproxy/haproxy.cfg','/usr/local/etc/haproxy')); p=pathlib.Path(m['Source'])/('haproxy.cfg' if m['Destination'].endswith('/haproxy') else ''); data=pathlib.Path('{{ remote_root }}/haproxy.candidate.cfg').read_bytes(); changed=p.read_bytes()!=data; p.write_bytes(data) if changed else None; print('changed' if changed else 'unchanged')"]
  register: ingress_update
  changed_when: ingress_update.stdout == 'changed'
- name: Gracefully reload HAProxy master
  ansible.builtin.command: docker kill --signal=USR2 solo-ingress
  when: ingress_update.changed
  changed_when: true
- name: Verify ingress remains healthy
  ansible.builtin.uri: {url: 'http://127.0.0.1/healthz', status_code: 200}
  register: ingress_health
  until: ingress_health.status == 200
  retries: 15
  delay: 1
  when: not ansible_check_mode and not (ingress_metrics_drain | default(false))
