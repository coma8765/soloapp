- title: HAProxy — Good RPS
  type: timeseries
  description: 'Good responses per second: 1xx, 2xx, 3xx. Backend user-traffic responses; active health checks and locally
    generated HAProxy errors without backend response are excluded. HTTP 4xx includes expected auth rejections, not only
    service faults. Observer estimates are deduplicated per ingress/backend/server/code before summing. No samples remain
    missing, never synthesized as zero.'
  datasource:
    type: prometheus
    uid: prometheus
  targets:
  - refId: A
    expr: sum by(ingress,proxy,server) (max by(ingress,proxy,server,code) (rate(haproxy_server_http_responses_total{ingress=~"$ingress",observer=~"$observer",server=~"$dc",proxy=~"auth_sites|grafana_sites",code=~"1xx|2xx|3xx"}[$__rate_interval])))
    legendFormat: '{{ingress}} → {{proxy}} / {{server}}'
    datasource:
      type: prometheus
      uid: prometheus
  fieldConfig:
    defaults:
      unit: reqps
      min: 0
      color:
        mode: fixed
        fixedColor: green
    overrides: []
  options:
    legend:
      displayMode: table
      placement: bottom
    tooltip:
      mode: multi
  id: 15
  gridPos:
    x: 0
    y: 64
    w: 12
    h: 8
