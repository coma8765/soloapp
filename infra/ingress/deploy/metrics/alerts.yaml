groups:
- name: soloapp.routing
  rules:
  - alert: IngressBackendUnavailable
    expr: max by(ingress,proxy,server)(haproxy_server_status{state="UP",proxy=~"auth_sites|grafana_sites"} and (time()-timestamp(haproxy_server_status)<20))
      == 0
    for: 1m
    labels:
      severity: warning
      project: soloapp
      service: routing
    annotations:
      summary: HAProxy исключил площадку из балансировки
      description: Вход {{ $labels.ingress }}, backend {{ $labels.proxy }}, сервер {{ $labels.server }} недоступен не менее
        1 минуты. Трафик перенаправляется на доступные backend.
      action: Проверьте check status/latency HAProxy, healthz и сеть до исключённой площадки.
    keep_firing_for: 3m
