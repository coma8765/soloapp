name: Build Keycloak image
on:
  push:
    paths: ['infra/keycloak/deploy/Dockerfile', 'infra/keycloak/deploy/entrypoint.sh', '.github/workflows/keycloak-image.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {persist-credentials: false}
    - name: Build optimized immutable image on CI
      run: |
        docker buildx create --use
        docker buildx build --platform linux/amd64 --provenance=false --sbom=false -f infra/keycloak/deploy/Dockerfile -t soloapp/keycloak:26.8.1 --output type=oci,dest="$RUNNER_TEMP/keycloak.oci.tar" .
        sha256sum "$RUNNER_TEMP/keycloak.oci.tar" > "$RUNNER_TEMP/keycloak.oci.tar.sha256"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: keycloak-image
        path: |
          ${{ runner.temp }}/keycloak.oci.tar
          ${{ runner.temp }}/keycloak.oci.tar.sha256
        retention-days: 3
