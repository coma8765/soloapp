name: Validate source
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install codegen dependencies
        run: |
          python3 -m venv .venv-codegen
          .venv-codegen/bin/pip install -r libs/api_codegen/requirements.txt -r libs/storage/requirements.txt -r infra/headlamp/tests/requirements.txt
      - name: Validate codegen and policy
        run: |
          make check-codegen test-codegen check-dashboards test-alerts
          .venv-codegen/bin/python -m unittest discover -s services/llama/tests -v
          .venv-codegen/bin/python -m unittest discover -s infra/cd/tests -v
          .venv-codegen/bin/python -m unittest discover -s infra/headlamp/tests -p "test_*.py" -v
          python3 -m unittest discover -s infra/registry/tests -v
          python3 -m unittest discover -s infra/redis/tests -v
          python3 -m unittest discover -s infra/network/tests -v
          .venv-codegen/bin/python -m unittest discover -s infra/object-storage/tests -v
      - name: Verify merge gate and monitoring exporter
        run: |
          .venv-codegen/bin/python -m unittest discover -s infra/ci/tests -v
          .venv-codegen/bin/python -m unittest discover -s infra/observability/tests -p 'test_*.py' -v
      - name: Test Telegram relay authorization and delivery
        run: node --test infra/telegram-relay/tests/worker.test.mjs
      - name: Install verified secret scanner
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan publication files and history
        run: make public-check
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install analysis tools
        run: |
          python3 -m venv .venv-quality
          .venv-quality/bin/pip install -r infra/ci/requirements.txt
          echo "$PWD/.venv-quality/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm --prefix services/app-api ci
      - name: Python static analysis and formatting
        run: python3 infra/ci/check.py python
      - name: C++ formatting and static analysis
        run: |
          python3 infra/ci/check.py cpp-format
          python3 infra/ci/check.py cpp-analysis
      - name: Worker JavaScript style and analysis
        run: |
          services/app-api/node_modules/.bin/prettier --check infra/telegram-relay/src infra/telegram-relay/tests libs/chat_runtime/src libs/chat_runtime/tests services/client-gateway/src/logic services/client-gateway/src/views services/client-gateway/src/main.mjs services/client-gateway/tests
          services/app-api/node_modules/.bin/oxlint infra/telegram-relay/src infra/telegram-relay/tests libs/chat_runtime/src libs/chat_runtime/tests services/client-gateway/src/logic services/client-gateway/src/views services/client-gateway/src/main.mjs services/client-gateway/tests
      - name: Game browser style and analysis
        run: |
          services/app-api/node_modules/.bin/prettier --check 'services/soloapp_app/public/client/*.{js,css}' services/soloapp_app/public/shared/world.js services/soloapp_app/tests/smoke.mjs
          services/app-api/node_modules/.bin/oxlint --deny-warnings services/soloapp_app/public/client services/soloapp_app/public/shared services/soloapp_app/tests/smoke.mjs
      - name: Validate GitHub Actions and embedded shell
        run: actionlint .github/workflows/ci.yaml .github/workflows/deploy.yaml
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [auth, client-notify]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and run isolated testsuite
        run: make test-${{ matrix.service }}
      - name: Build client-notify runtime image
        if: matrix.service == 'client-notify'
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --target runtime -f services/client-notify/deploy/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$GITHUB_SHA" --output type=oci,dest="$RUNNER_TEMP/client-notify.oci.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.service == 'client-notify'
        with:
          name: client-notify-image
          path: ${{ runner.temp }}/client-notify.oci.tar
          retention-days: 1
  app-api:
    name: app-api (NestJS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build NestJS and run format, lint, unit and e2e tests
        run: make test-app-api
      - name: Build production NestJS image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --target runtime -f services/app-api/deploy/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$GITHUB_SHA" --output type=oci,dest="$RUNNER_TEMP/whoami.oci.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-api-image
          path: ${{ runner.temp }}/whoami.oci.tar
          retention-days: 1
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: synthetic-ci-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - run: npm --prefix services/client-gateway ci
      - name: Test shared outbox recovery
        run: npm --prefix libs/chat_runtime test
      - name: Test browser ACK across gateway pods with real PostgreSQL
        run: npm --prefix services/client-gateway test
        env: {TEST_PG_PORT: '5432'}
      - name: Build immutable gateway image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --target runtime -f services/client-gateway/deploy/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$GITHUB_SHA" --output type=oci,dest="$RUNNER_TEMP/client-gateway.oci.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-gateway-image
          path: ${{ runner.temp }}/client-gateway.oci.tar
          retention-days: 1
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: python3 ../../infra/ci/check.py dart-format
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - name: Build and validate versioned web bundle
        env:
          SHA: ${{ github.sha }}
        run: |
          flutter build web --release --no-web-resources-cdn --base-href "/web/releases/$SHA/" --dart-define="APP_VERSION=$SHA"
          python3 deploy/package.py "$SHA" "$RUNNER_TEMP/web.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-bundle
          path: ${{ runner.temp }}/web.tar.gz
          retention-days: 1

  required:
    name: Required checks
    if: always()
    needs: [source, quality, services, app-api, web, gateway, keycloak, soloapp, llama]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject failed, skipped or cancelled checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 infra/ci/gate.py

  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: pip install -r infra/headlamp/tests/requirements.txt
      - run: make test-keycloak
      - name: Build optimized Keycloak runtime on CI
        run: |
          docker buildx create --use
          bash infra/registry/build.sh "$GITHUB_SHA" "$RUNNER_TEMP/images" keycloak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keycloak-image
          path: ${{ runner.temp }}/images/keycloak.oci.tar
          retention-days: 3

  soloapp:
    name: soloapp_app (C++ and browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test speech isolation and audio windows
        run: |
          python3 -m unittest discover -s services/tts/tests -v
          python3 -m unittest discover -s services/whisper/tests -v
          node services/soloapp_app/tests/speech.test.mjs
          node services/soloapp_app/tests/professor-voice.test.mjs
      - name: Build offline TTS runtime
        run: docker build -t soloapp-tts-test -f services/tts/deploy/Dockerfile .
      - name: Verify synthesis without network or writable filesystem
        run: docker run --rm --network none --read-only --cap-drop=ALL -v "$PWD/services/tts/tests/smoke.py:/smoke.py:ro" --entrypoint python3 soloapp-tts-test /smoke.py
      - name: Build offline Whisper runtime
        run: |
          docker buildx create --name whisper-builder --use
          docker buildx build --load -t soloapp-whisper-test -f services/whisper/deploy/Dockerfile .
      - name: Verify real Whisper offline model within pod resource limits
        run: docker run --rm --network none --read-only --cap-drop=ALL --memory=2560m --cpus=2 -v "$PWD/services/whisper/tests/smoke.py:/smoke.py:ro" --entrypoint python3 soloapp-whisper-test /smoke.py
      - name: Export immutable Whisper image
        run: docker buildx build --platform linux/amd64 --provenance=false --sbom=false --target runtime --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$GITHUB_SHA" -f services/whisper/deploy/Dockerfile --output type=oci,dest="$RUNNER_TEMP/whisper.oci.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whisper-image
          path: ${{ runner.temp }}/whisper.oci.tar
          retention-days: 1
          compression-level: 0
      - name: Build C++ and test checkpoint recovery
        run: |
          docker buildx create --use
          docker buildx build --load --target build -t soloapp-test -f services/soloapp_app/deploy/Dockerfile .
      - name: Build immutable soloapp backend
        run: |
          bash infra/registry/build.sh "$GITHUB_SHA" "$RUNNER_TEMP/backend-images" app-api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soloapp-backend-image
          path: ${{ runner.temp }}/backend-images/whoami.oci.tar
          retention-days: 3
          compression-level: 0
      - name: Test database election and old leader fencing
        run: bash services/soloapp_app/tests/integration.sh
      - name: Validate versioned browser bundle
        run: python3 services/soloapp_app/deploy/package.py "$GITHUB_SHA" "$RUNNER_TEMP/soloapp-web.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soloapp-web-bundle
          path: ${{ runner.temp }}/soloapp-web.tar.gz
          retention-days: 3

  llama:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build and verify offline model
        run: |
          docker buildx create --use
          docker buildx build --load -t soloapp-llama-test -f services/llama/deploy/Dockerfile .
          python3 services/llama/tests/smoke.py
          bash infra/registry/build.sh "$GITHUB_SHA" "$RUNNER_TEMP/images" llama
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llama-image
          path: ${{ runner.temp }}/images/llama.oci.tar
          retention-days: 3
          compression-level: 0
