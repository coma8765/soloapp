name: Deploy production
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Recommended: one service. app-api = soloapp_app; all = coordinated release'
        required: true
        type: choice
        default: app-api
        options: [app-api, client-notify, client-gateway, auth, web, nginx, keycloak, whisper, tts, llama, all]
      refresh_whisper_base:
        description: Rebuild Whisper model/CUDA base instead of reusing the saved base
        required: false
        type: boolean
        default: false
      force_image_transfer:
        description: Resend cached image layers (normally only missing layers are sent)
        required: false
        type: boolean
        default: false
      rollback_revision:
        description: Previously deployed v0.1.P or full commit SHA; empty for a new release
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  notify-start:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Notify deployment start per service
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOY_STATE: started
          ROLLBACK: ${{ inputs.rollback_revision }}
          CD_NOTIFY_URL: ${{ secrets.CD_NOTIFY_URL }}
          CD_NOTIFY_TOKEN: ${{ secrets.CD_NOTIFY_TOKEN }}
        run: python3 infra/cd/notify.py
  prepare:
    needs: notify-start
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      target: ${{ steps.version.outputs.target }}
      version: ${{ steps.version.outputs.version }}
      operation: ${{ steps.version.outputs.operation }}
      service: ${{ steps.scope.outputs.service }}
      images: ${{ steps.scope.outputs.images }}
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - name: Validate isolated deployment scope
        id: scope
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            auth) images=auth ;;
            app-api) images=whoami ;;
            web) images=web ;;
            nginx) images='' ;;
            client-notify) images=client-notify ;;
            client-gateway) images=client-gateway ;;
            keycloak) images=keycloak ;;
            whisper) images=whisper ;;
            tts) images=tts ;;
            llama) images=llama ;;
            all) images='auth whoami web client-notify client-gateway keycloak whisper tts llama' ;;
            *) exit 2 ;;
          esac
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Wait for pinned revision main push CI (up to 40 minutes)
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED: ${{ github.sha }}
        run: python3 infra/cd/wait_green.py
      - name: Reserve version or resolve rollback
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.revision.outputs.sha }}
          ROLLBACK: ${{ inputs.rollback_revision }}
        run: |
          if [ -n "$ROLLBACK" ]; then
            python3 infra/cd/version.py resolve "$ROLLBACK"
          else
            python3 infra/cd/version.py reserve "$SHA"
          fi
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Prepare restricted deployment identities
        env:
          YC_KEY: ${{ secrets.CD_YC_KEY }}
          HOME_KEY: ${{ secrets.CD_HOME_KEY }}
          KNOWN_HOSTS: ${{ secrets.CD_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/cd"
          printf '%s\n' "$YC_KEY" > "$RUNNER_TEMP/cd/yc"
          printf '%s\n' "$HOME_KEY" > "$RUNNER_TEMP/cd/home"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/cd/known_hosts"
      - name: Package exact web revision
        if: inputs.rollback_revision == '' && (needs.prepare.outputs.service == 'web' || needs.prepare.outputs.service == 'all')
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 services/soloapp_app/deploy/package.py "$SHA" "$RUNNER_TEMP/web.tar.gz"
      - name: Publish and verify both S3 replicas before activation
        if: inputs.rollback_revision == '' && (needs.prepare.outputs.service == 'web' || needs.prepare.outputs.service == 'all')
        env:
          HOST: ${{ secrets.CD_YC_HOST }}
          PORT: ${{ secrets.CD_YC_PORT }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          ssh -i "$RUNNER_TEMP/cd/yc" -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
            -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "soloapp-cd@$HOST" "publish $SHA" < "$RUNNER_TEMP/web.tar.gz"
      - name: Reserve disk space for image archives and Whisper cache
        if: inputs.rollback_revision == '' && (needs.prepare.outputs.service == 'whisper' || needs.prepare.outputs.service == 'all')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Restore persistent Whisper base cache
        if: inputs.rollback_revision == '' && !inputs.refresh_whisper_base && (needs.prepare.outputs.service == 'whisper' || needs.prepare.outputs.service == 'all')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/whisper-base
          key: whisper-base-v1-${{ hashFiles('services/whisper/deploy/Dockerfile', 'services/whisper/deploy/requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whisper-base-v1-${{ hashFiles('services/whisper/deploy/Dockerfile', 'services/whisper/deploy/requirements.txt') }}-
      - name: Build runtime images on GitHub runner
        if: inputs.rollback_revision == '' && needs.prepare.outputs.service != 'nginx'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          WHISPER_BASE_CACHE: ${{ runner.temp }}/whisper-base
          REFRESH_WHISPER_BASE: ${{ inputs.refresh_whisper_base }}
          SERVICE: ${{ needs.prepare.outputs.service }}
        run: |
          docker buildx create --use
          bash infra/registry/build.sh "$SHA" "$RUNNER_TEMP/images" "$SERVICE"
      - name: Save persistent Whisper base cache
        if: inputs.rollback_revision == '' && (needs.prepare.outputs.service == 'whisper' || needs.prepare.outputs.service == 'all')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/whisper-base
          key: whisper-base-v1-${{ hashFiles('services/whisper/deploy/Dockerfile', 'services/whisper/deploy/requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish identical runtime images to both private registries
        if: inputs.rollback_revision == '' && needs.prepare.outputs.service != 'nginx'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          YC_HOST: ${{ secrets.CD_YC_HOST }}
          HOME_HOST: ${{ secrets.CD_HOME_HOST }}
          YC_PORT: ${{ secrets.CD_YC_PORT }}
          HOME_PORT: ${{ secrets.CD_HOME_PORT }}
          IMAGES: ${{ needs.prepare.outputs.images }}
          FORCE_IMAGE_TRANSFER: ${{ inputs.force_image_transfer }}
        run: |
          set -euo pipefail
          transfer_options=()
          if [ "$FORCE_IMAGE_TRANSFER" = true ]; then transfer_options+=(--force); fi
          mirror_image() {
            local site=$1 service=$2 host port
            if [ "$site" = yc ]; then host=$YC_HOST; port=$YC_PORT; else host=$HOME_HOST; port=$HOME_PORT; fi
            ssh -i "$RUNNER_TEMP/cd/$site" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
              -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              "soloapp-cd@$host" "mirror-$service $SHA"
          }
          for service in $IMAGES; do
            if [ "$FORCE_IMAGE_TRANSFER" != true ]; then
              # Reuse a previously published immutable image, including partial releases.
              # Both directions must verify successfully before skipping the new archive.
              if mirror_image home "$service"; then
                mirror_image yc "$service"
                continue
              fi
              if mirror_image yc "$service"; then
                mirror_image home "$service"
                continue
              fi
            fi
            for site in yc home; do
              if [ "$site" = yc ]; then host=$YC_HOST; port=$YC_PORT; else host=$HOME_HOST; port=$HOME_PORT; fi
              if [ "$site" = home ] && [ "$FORCE_IMAGE_TRANSFER" != true ]; then
                ssh -i "$RUNNER_TEMP/cd/$site" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
                  -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                  "soloapp-cd@$host" "mirror-$service $SHA"
                continue
              fi
              python3 infra/registry/upload.py --archive "$RUNNER_TEMP/images/$service.oci.tar" --revision "$SHA" "${transfer_options[@]}" -- \
                ssh -i "$RUNNER_TEMP/cd/$site" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
                -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                "soloapp-cd@$host" "push-$service $SHA"
            done
          done
      - name: Roll YC
        if: needs.prepare.outputs.service != 'llama'
        env:
          HOST: ${{ secrets.CD_YC_HOST }}
          PORT: ${{ secrets.CD_YC_PORT }}
          SHA: ${{ needs.prepare.outputs.target }}
          OPERATION: ${{ needs.prepare.outputs.operation }}
          SERVICE: ${{ needs.prepare.outputs.service }}
          SOLOAPP_BASE_URL: ${{ secrets.SOLOAPP_BASE_URL }}
        run: |
          ssh -i "$RUNNER_TEMP/cd/yc" -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
            -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "soloapp-cd@$HOST" "$OPERATION-$SERVICE $SHA"
      - name: Roll home and verify public API
        env:
          HOST: ${{ secrets.CD_HOME_HOST }}
          PORT: ${{ secrets.CD_HOME_PORT }}
          SHA: ${{ needs.prepare.outputs.target }}
          OPERATION: ${{ needs.prepare.outputs.operation }}
          SERVICE: ${{ needs.prepare.outputs.service }}
          SOLOAPP_BASE_URL: ${{ secrets.SOLOAPP_BASE_URL }}
        run: |
          ssh -i "$RUNNER_TEMP/cd/home" -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cd/known_hosts" \
            -o ForwardAgent=no -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "soloapp-cd@$HOST" "$OPERATION-$SERVICE $SHA"
          python3 services/nginx/tests/smoke.py
          if [ "$SERVICE" = web ] || [ "$SERVICE" = all ]; then
            python3 services/web/tests/smoke.py "$SHA"
          fi
          printf 'Deployed %s at %s to YC and home.\n' "$SERVICE" "$SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/cd"
  notify-result:
    needs: [notify-start, prepare, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Notify deployment result per service
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOY_STATE: ${{ (needs.prepare.result == 'cancelled' || needs.deploy.result == 'cancelled') && 'cancelled' || (needs.prepare.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          PHASE: ${{ needs.prepare.result == 'success' && 'rollout' || 'prepare' }}
          ROLLBACK: ${{ inputs.rollback_revision }}
          TARGET: ${{ needs.prepare.outputs.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CD_NOTIFY_URL: ${{ secrets.CD_NOTIFY_URL }}
          CD_NOTIFY_TOKEN: ${{ secrets.CD_NOTIFY_TOKEN }}
        run: python3 infra/cd/notify.py
